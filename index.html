<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
<meta name="referrer" content="no-referrer" />
<title>Micky的生活日记</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --accent: #2b6cff;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #333333;
    --muted: rgba(128, 128, 128, 0.95);
    --line: rgba(128, 128, 128, 0.25);
    --radius: 12px;
    --base: 14px;
    --font: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--base); transition: background .2s ease, color .2s ease; }
  #app { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  .bar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .bar h1 { font-size: 1.4em; margin: 0; }
  .login { max-width: 320px; margin: 64px auto; text-align: center; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text); font-size: 1em; font-family: inherit; }
  .err { font-size: .93em; color: #d9483b; }
  button { padding: 8px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text); font-size: 1em; font-family: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; margin-top: 8px; }
  button.small { font-size: .86em; padding: 5px 10px; }
  button.preset { font-size: .86em; padding: 5px 10px; margin-right: 8px; margin-bottom: 8px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text); font-size: 1em; font-family: inherit; }
  .status { font-size: .86em; color: var(--muted); line-height: 1.7; }
  .panel { border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; background: var(--card); margin-bottom: 18px; }
  .panel h2 { font-size: 1.05em; margin: 0 0 12px; }
  .panel .row label { width: 84px; }
  .editor { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--card); }
  .editor h2 { font-size: 1.05em; margin: 0 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .row label { width: 42px; font-size: .95em; color: var(--muted); }
  .row input, .row textarea, .row select { flex: 1; min-width: 150px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text); font-size: 1em; font-family: inherit; }
  .row input[type='color'] { flex: 0 0 56px; min-width: 56px; height: 34px; padding: 2px; cursor: pointer; }
  .row input[type='range'] { flex: 1; padding: 0; }
  .row input[type='file'] { min-width: 200px; }
  .preview { width: 140px; border-radius: var(--radius); margin-top: 8px; display: block; }
  .tip { font-size: .93em; color: var(--muted); }
  .timeline { margin-top: 28px; }
  .timeline.waterfall { column-count: 2; column-gap: 14px; }
  .timeline.waterfall .entry { break-inside: avoid; }
  @media (max-width: 620px) { .timeline.waterfall { column-count: 1; } }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .meta { font-size: .93em; color: var(--muted); }
  .entry h3 { font-size: 1.15em; margin: 6px 0; }
  .content { font-size: 1em; line-height: 1.9; white-space: pre-wrap; margin: 0; }
  .photo { max-width: 100%; border-radius: var(--radius); margin-top: 8px; }
  .del { font-size: .86em; padding: 4px 10px; margin-top: 10px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); font-size: 1em; padding: 40px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <h1>{{ theme.title }}</h1>
    <button v-if="isLoggedIn" @click="logout">退出登录</button>
  </header>

  <section v-if="!isLoggedIn" class="login">
    <p>私人空间，请输入登录口令</p>
    <input type="password" v-model="pwd" placeholder="请输入登录口令" @keyup.enter="login" />
    <button class="primary" @click="login">进入我的日记本</button>
    <p class="err" v-if="errorMsg">{{ errorMsg }}</p>
  </section>

  <template v-else>
    <section class="toolbar">
      <input v-model="keyword" placeholder="🔍 搜索标题 / 内容 / 心情 / 天气" />
      <span class="status">共 {{ list.length }} 篇</span>
      <button class="small" @click="showTheme = !showTheme; showSync = false">🎨 样式 DIY</button>
      <button class="small" @click="showSync = !showSync; showTheme = false">☁️ 同步设置</button>
      <button class="small" v-if="syncReady" @click="syncNow">{{ syncing ? '同步中…' : '立即同步' }}</button>
      <span class="status">{{ syncMsg }}</span>
    </section>

    <section class="panel" v-if="showTheme">
      <h2>🎨 样式 DIY（改完立刻生效，自动保存）</h2>
      <div class="row">
        <label>预设主题</label>
        <div>
          <button class="preset" v-for="p in presets" :key="p.name" @click="applyPreset(p)">{{ p.name }}</button>
        </div>
      </div>
      <div class="row"><label>主色调</label><input type="color" v-model="theme.accent" @input="onThemeInput" /><span class="status">按钮、链接、高亮都用它</span></div>
      <div class="row"><label>页面背景</label><input type="color" v-model="theme.bg" @input="onThemeInput" /></div>
      <div class="row"><label>卡片背景</label><input type="color" v-model="theme.card" @input="onThemeInput" /></div>
      <div class="row"><label>文字颜色</label><input type="color" v-model="theme.text" @input="onThemeInput" /></div>
      <div class="row"><label>圆角大小</label><input type="range" min="0" max="28" step="1" v-model.number="theme.radius" @input="onThemeInput" /><span class="status">{{ theme.radius }} px</span></div>
      <div class="row">
        <label>字体</label>
        <select v-model="theme.font" @change="onThemeInput">
          <option value="system">系统默认（现代无衬线）</option>
          <option value="serif">宋体 / 衬线（纸张感）</option>
          <option value="kai">楷体（手写感）</option>
          <option value="mono">等宽（极客感）</option>
        </select>
      </div>
      <div class="row">
        <label>正文字号</label>
        <select v-model="theme.size" @change="onThemeInput">
          <option value="sm">小（13px）</option>
          <option value="md">中（14px）</option>
          <option value="lg">大（16px）</option>
        </select>
      </div>
      <div class="row">
        <label>日记布局</label>
        <select v-model="theme.layout" @change="onThemeInput">
          <option value="timeline">时间轴（单列）</option>
          <option value="waterfall">瀑布流（双列）</option>
        </select>
      </div>
      <div class="row"><label>首页标题</label><input v-model="theme.title" @input="onThemeInput" placeholder="例如 📔 Micky的生活日记" /></div>
      <div class="row">
        <label>日记排序</label>
        <select v-model="theme.sort" @change="onSortChange">
          <option value="date">按日记日期，最新的在最前</option>
          <option value="created">按记录时间，刚写的在最前</option>
        </select>
      </div>
      <button @click="resetTheme">恢复默认样式</button>
      <p class="status">样式会存在本机，并跟着日记一起同步到你的私有仓库，换设备也是同一套样式。</p>
    </section>

    <section class="panel" v-if="showSync">
      <h2>☁️ 跨设备同步（GitHub 私有仓库）</h2>
      <p class="status" v-if="syncReady">已连接：{{ sync.owner }}/{{ sync.repo }} · {{ sync.file }}</p>
      <p class="status" v-else>在一台设备上填好并保存后，其它设备填同样内容即可看到同一批日记。</p>
      <div class="row"><label>账号</label><input v-model="form2.owner" placeholder="GitHub 用户名" /></div>
      <div class="row"><label>数据仓库</label><input v-model="form2.repo" placeholder="micky-diary-data" /></div>
      <div class="row"><label>文件名</label><input v-model="form2.file" placeholder="diary.json" /></div>
      <div class="row"><label>访问令牌</label><input type="password" v-model="form2.token" placeholder="粘贴 github_pat_ 开头的令牌，前后不要带空格" /></div>
      <button @click="checkToken">检测密钥</button>
      <button class="primary" @click="enableSync" style="margin-left:10px;">保存并开始同步</button>
      <button v-if="syncReady" @click="disableSync" style="margin-left:10px;">断开同步</button>
      <p class="status">令牌只保存在这台设备的浏览器里，不会写进网页源码。第一次建议先点「检测密钥」，看到 ✅ 再保存。</p>
      <p class="status">如果提示 404：<a href="https://github.com/settings/tokens?type=beta" target="_blank">打开我的 Fine-grained tokens</a>，进入你用的那个令牌，把 micky-diary-data 勾进 Repository access，并把 Contents 设为 Read and write，然后回这里重新点「检测密钥」。</p>
    </section>

    <section class="editor">
      <h2>✍️ 写一篇新日记</h2>
      <div class="row"><label>日期</label><input type="date" v-model="form.date" /></div>
      <div class="row"><label>标题</label><input v-model="form.title" placeholder="给今天起个名字" /></div>
      <div class="row"><label>正文</label><textarea v-model="form.content" rows="4" placeholder="今天发生了什么？"></textarea></div>
      <div class="row">
        <label>心情</label>
        <select v-model="form.mood"><option>开心</option><option>平静</option><option>疲惫</option><option>难过</option></select>
        <label>天气</label>
        <select v-model="form.weather"><option>晴</option><option>多云</option><option>小雨</option><option>雪</option></select>
      </div>
      <div class="row"><label>照片</label><input type="file" accept="image/*" @change="pickPhoto" /></div>
      <p class="status" v-if="compressing">正在压缩照片…</p>
      <img v-if="form.photo" :src="form.photo" class="preview" alt="照片预览" />
      <button class="primary" @click="save">保存到时间轴</button>
      <p class="tip" v-if="tip">{{ tip }}</p>
    </section>

    <section class="timeline" :class="{ waterfall: theme.layout === 'waterfall' }">
      <p class="empty" v-if="filtered.length === 0">还没有日记，写下第一篇吧 ✨</p>
      <article class="entry" v-for="item in filtered" :key="item.id">
        <div class="meta">📅 {{ item.date }} · {{ item.weather }} · {{ item.mood }}</div>
        <h3>{{ item.title }}</h3>
        <p class="content">{{ item.content }}</p>
        <img v-if="item.photo" :src="item.photo" class="photo" alt="日记照片" />
        <br />
        <button class="del" @click="remove(item.id)">删除</button>
      </article>
    </section>
  </template>
</div>

<script>
const { createApp } = Vue;
const DATA_KEY = 'micky-diary-data';
const SYNC_KEY = 'micky-diary-sync';

const DEFAULT_THEME = {
  title: '📔 Micky的生活日记',
  accent: '#2b6cff',
  bg: '#f7f8fa',
  card: '#ffffff',
  text: '#333333',
  radius: 12,
  font: 'system',
  size: 'md',
  sort: 'date',
  layout: 'timeline'
};

const PRESETS = [
  { name: '简约清新', theme: { title: '📔 Micky的生活日记', accent: '#2b6cff', bg: '#f7f8fa', card: '#ffffff', text: '#333333', radius: 12, font: 'system', size: 'md', layout: 'timeline' } },
  { name: '暗黑极简', theme: { title: '🌙 我的夜晚日记', accent: '#5b8cff', bg: '#14161b', card: '#1e2128', text: '#e9e9ec', radius: 10, font: 'system', size: 'md', layout: 'timeline' } },
  { name: '复古纸张', theme: { title: '📜 旧时光手记', accent: '#a8622a', bg: '#f4ecdc', card: '#fffaf0', text: '#4a3b2a', radius: 4, font: 'serif', size: 'md', layout: 'timeline' } },
  { name: '蜜桃少女', theme: { title: '🍑 甜甜的日子', accent: '#ff6f91', bg: '#fff5f7', card: '#ffffff', text: '#5a4550', radius: 20, font: 'kai', size: 'md', layout: 'waterfall' } },
  { name: '森林绿意', theme: { title: '🌿 慢慢生活', accent: '#2f9e5f', bg: '#f2f8f3', card: '#ffffff', text: '#2f3a33', radius: 14, font: 'system', size: 'lg', layout: 'waterfall' } }
];

const FONT_MAP = {
  system: "-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif",
  serif: "Georgia, 'Songti SC', SimSun, serif",
  kai: "'Kaiti SC', KaiTi, STKaiti, serif",
  mono: "Consolas, 'Courier New', monospace"
};

const SIZE_MAP = { sm: '13px', md: '14px', lg: '16px' };

function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function b64decode(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

createApp({
  data() {
    return {
      SECRET: '051222520',
      pwd: '',
      isLoggedIn: false,
      errorMsg: '',
      keyword: '',
      tip: '',
      compressing: false,
      showSync: false,
      showTheme: false,
      presets: PRESETS,
      theme: Object.assign({}, DEFAULT_THEME),
      themeUpdatedAt: 0,
      themeTimer: null,
      sync: { owner: '2329118415-lang', repo: 'micky-diary-data', file: 'diary.json', token: '' },
      form2: { owner: '2329118415-lang', repo: 'micky-diary-data', file: 'diary.json', token: '' },
      remoteSha: null,
      syncMsg: '未开启同步',
      syncState: 'off',
      syncing: false,
      pendingAgain: false,
      syncTimer: null,
      autoTimer: null,
      lastSyncTs: 0,
      form: { date: '', title: '', content: '', mood: '开心', weather: '晴', photo: '' },
      list: [],
      deletedIds: []
    };
  },
  computed: {
    filtered() {
      const k = this.keyword.trim();
      if (!k) return this.list;
      return this.list.filter((item) => (item.title + item.content + item.mood + item.weather).indexOf(k) > -1);
    },
    syncReady() {
      return !!(this.sync.owner && this.sync.repo && this.sync.token);
    }
  },
  mounted() {
    const saved = localStorage.getItem(DATA_KEY);
    if (saved) {
      try {
        const doc = JSON.parse(saved);
        this.list = doc.entries || [];
        this.deletedIds = doc.deletedIds || [];
        if (doc.theme) this.theme = Object.assign({}, DEFAULT_THEME, doc.theme);
        this.themeUpdatedAt = doc.themeUpdatedAt || 0;
      } catch (err) { this.list = []; }
    }
    this.sortEntries();
    this.applyTheme();
    const cfg = localStorage.getItem(SYNC_KEY);
    if (cfg) {
      try {
        this.sync = JSON.parse(cfg);
        this.form2 = Object.assign({}, this.sync);
        this.syncMsg = '已连接，登录后自动同步';
      } catch (err) { /* ignore */ }
    }
    const self = this;
    this.autoTimer = setInterval(function () {
      if (self.isLoggedIn && self.syncReady) self.maybeAutoSync(25000);
    }, 30000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) self.maybeAutoSync(10000);
    });
    window.addEventListener('focus', function () { self.maybeAutoSync(10000); });
    window.addEventListener('online', function () { if (self.syncReady && self.isLoggedIn) self.syncNow(); });
  },
  methods: {
    today() {
      const d = new Date();
      const m = ('0' + (d.getMonth() + 1)).slice(-2);
      const day = ('0' + d.getDate()).slice(-2);
      return d.getFullYear() + '-' + m + '-' + day;
    },
    sortList(arr) {
      const byCreated = !!(this.theme && this.theme.sort === 'created');
      arr.sort((a, b) => {
        const at = a.updatedAt || a.id || 0;
        const bt = b.updatedAt || b.id || 0;
        if (byCreated) return bt - at;
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return bt - at;
      });
      return arr;
    },
    sortEntries() {
      this.sortList(this.list);
    },
    onSortChange() {
      this.sortEntries();
      this.onThemeInput();
    },
    applyTheme() {
      const root = document.documentElement;
      root.style.setProperty('--accent', this.theme.accent);
      root.style.setProperty('--bg', this.theme.bg);
      root.style.setProperty('--card', this.theme.card);
      root.style.setProperty('--text', this.theme.text);
      root.style.setProperty('--radius', this.theme.radius + 'px');
      root.style.setProperty('--font', FONT_MAP[this.theme.font] || FONT_MAP.system);
      root.style.setProperty('--base', SIZE_MAP[this.theme.size] || SIZE_MAP.md);
    },
    onThemeInput() {
      this.theme.radius = Number(this.theme.radius) || 0;
      this.themeUpdatedAt = Date.now();
      this.applyTheme();
      this.persistLocal();
      this.scheduleSync(1500);
    },
    applyPreset(p) {
      this.theme = Object.assign({}, DEFAULT_THEME, p.theme);
      this.themeUpdatedAt = Date.now();
      this.applyTheme();
      this.persistLocal();
      this.scheduleSync(300);
    },
    resetTheme() {
      this.theme = Object.assign({}, DEFAULT_THEME);
      this.themeUpdatedAt = Date.now();
      this.applyTheme();
      this.persistLocal();
      this.scheduleSync(300);
    },
    login() {
      if (this.pwd === this.SECRET) {
        this.isLoggedIn = true;
        this.errorMsg = '';
        if (this.syncReady) this.syncNow();
      } else {
        this.errorMsg = '口令不正确，只有你可以进入这个空间';
      }
    },
    logout() {
      this.isLoggedIn = false;
      this.pwd = '';
      this.keyword = '';
      this.showSync = false;
      this.showTheme = false;
    },
    persistLocal() {
      try {
        localStorage.setItem(DATA_KEY, JSON.stringify({
          entries: this.list,
          deletedIds: this.deletedIds,
          theme: this.theme,
          themeUpdatedAt: this.themeUpdatedAt
        }));
        return true;
      } catch (err) {
        this.tip = '本地保存失败（照片太大），换一张小一点的照片试试';
        return false;
      }
    },
    docPath() {
      return '/repos/' + this.sync.owner + '/' + this.sync.repo + '/contents/' + this.sync.file;
    },
    async gh(path, options) {
      const opt = options || {};
      const token = String(this.sync.token || '').trim();
      const headers = Object.assign({
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }, opt.headers || {});
      const res = await fetch('https://api.github.com' + path, Object.assign({}, opt, { headers: headers }));
      if (!res.ok) {
        let hint = '';
        if (res.status === 401) hint = '密钥无效（401 Bad credentials）：多为没粘贴上、复制不完整、带了空格/换行，或密钥已被删除或过期，请重新生成一个再试';
        else if (res.status === 403) hint = '权限不足（403）：把 Repository permissions → Contents 改成 Read and write 后重新生成密钥';
        else if (res.status === 404) hint = '找不到仓库（404）：GitHub 对没有权限的私有仓库统一返回 404。请到 GitHub → Settings → Developer settings → Fine-grained tokens → 打开你用的那个令牌 → Repository access 勾上 micky-diary-data，并把 Contents 设为 Read and write';
        else hint = 'HTTP ' + res.status + ' ' + (await res.text()).slice(0, 120);
        const err = new Error(hint);
        err.status = res.status;
        throw err;
      }
      return res.json();
    },
    tokenLooksValid(token) {
      const t = String(token || '').trim();
      return t.indexOf('github_pat_') === 0 || t.indexOf('ghp_') === 0 || t.indexOf('gho_') === 0 || t.indexOf('ghu_') === 0;
    },
    async checkToken() {
      this.normalizeForm2();
      this.sync = Object.assign({}, this.form2);
      if (!this.form2.token) { this.syncMsg = '⚠️ 访问令牌是空的，请先把 github_pat_... 那串粘贴进来'; return; }
      if (!this.tokenLooksValid(this.form2.token)) {
        this.syncMsg = '⚠️ 这串不像 GitHub 令牌（应以 github_pat_ 或 ghp_ 开头，当前长度 ' + this.form2.token.length + ' 个字符），请确认复制的是令牌本身，不是令牌名字';
        return;
      }
      this.syncMsg = '正在检测密钥…';
      try {
        const me = await this.gh('/user');
        let extra = '';
        if (this.form2.owner && this.form2.repo) {
          try {
            await this.gh('/repos/' + this.form2.owner + '/' + this.form2.repo);
            extra = '，并且能访问仓库 ' + this.form2.owner + '/' + this.form2.repo;
          } catch (err2) {
            extra = '，但仓库检查没通过 → ' + err2.message;
          }
        }
        this.syncMsg = '✅ 密钥有效，属于账号 ' + me.login + '（长度 ' + this.form2.token.length + ' 字符）' + extra;
      } catch (err) {
        this.syncMsg = '⚠️ ' + err.message;
      }
    },
    normalizeForm2() {
      this.form2.owner = String(this.form2.owner || '').trim().replace(/^@/, '');
      this.form2.repo = String(this.form2.repo || '').trim();
      this.form2.file = String(this.form2.file || '').trim() || 'diary.json';
      this.form2.token = String(this.form2.token || '').trim();
    },
    async pullRemote() {
      try {
        const data = await this.gh(this.docPath() + '?t=' + Date.now());
        this.remoteSha = data.sha;
        const remote = JSON.parse(b64decode((data.content || '').replace(/\s/g, '')));
        return remote || { entries: [], deletedIds: [] };
      } catch (err) {
        if (err.status === 404) { this.remoteSha = null; return { entries: [], deletedIds: [] }; }
        throw err;
      }
    },
    mergeDocs(local, remote) {
      const deletedIds = Array.from(new Set([].concat(local.deletedIds || [], remote.deletedIds || [])));
      const map = {};
      [].concat(remote.entries || [], local.entries || []).forEach((item) => {
        if (!item || item.id === undefined || item.id === null) return;
        if (deletedIds.indexOf(item.id) > -1) return;
        const key = String(item.id);
        const old = map[key];
        if (!old || (item.updatedAt || 0) >= (old.updatedAt || 0)) map[key] = item;
      });
      const entries = this.sortList(Object.keys(map).map((k) => map[k]));
      const theme = (remote.themeUpdatedAt || 0) > (local.themeUpdatedAt || 0)
        ? remote.theme
        : (local.theme || remote.theme);
      const themeUpdatedAt = Math.max(remote.themeUpdatedAt || 0, local.themeUpdatedAt || 0);
      const same = JSON.stringify(entries) === JSON.stringify(remote.entries || [])
        && JSON.stringify(theme || null) === JSON.stringify(remote.theme || null)
        && JSON.stringify(deletedIds) === JSON.stringify(remote.deletedIds || []);
      return { entries: entries, deletedIds: deletedIds, theme: theme, themeUpdatedAt: themeUpdatedAt, same: same };
    },
    async pushRemote() {
      const doc = {
        updatedAt: Date.now(),
        entries: this.list,
        deletedIds: this.deletedIds,
        theme: this.theme,
        themeUpdatedAt: this.themeUpdatedAt
      };
      const body = { message: 'sync diary ' + new Date().toISOString(), content: b64encode(JSON.stringify(doc)) };
      if (this.remoteSha) body.sha = this.remoteSha;
      const data = await this.gh(this.docPath(), { method: 'PUT', body: JSON.stringify(body) });
      this.remoteSha = data.content ? data.content.sha : this.remoteSha;
    },
    async syncNow() {
      if (!this.syncReady) {
        this.syncState = 'off';
        this.syncMsg = '未开启同步：日记只存在本机';
        return;
      }
      if (this.syncing) { this.syncState = 'pending'; this.pendingAgain = true; return; }
      this.syncing = true;
      this.syncState = 'syncing';
      this.syncMsg = '☁️ 同步中…';
      try {
        const remote = await this.pullRemote();
        const merged = this.mergeDocs({
          entries: this.list,
          deletedIds: this.deletedIds,
          theme: this.theme,
          themeUpdatedAt: this.themeUpdatedAt
        }, remote);
        this.list = merged.entries;
        this.deletedIds = merged.deletedIds;
        this.sortEntries();
        this.theme = Object.assign({}, DEFAULT_THEME, merged.theme || {});
        this.themeUpdatedAt = merged.themeUpdatedAt;
        this.applyTheme();
        this.persistLocal();
        if (!merged.same || !this.remoteSha) await this.pushRemote();
        this.syncing = false;
        this.syncState = 'ok';
        this.lastSyncTs = Date.now();
        const time = new Date().toLocaleTimeString();
        this.syncMsg = '✅ 已同步 · ' + time;
        if (this.tip.indexOf('正在同步') > -1) this.tip = '已保存，并已同步到云端 ✅ · ' + time;
        if (this.pendingAgain) { this.pendingAgain = false; this.scheduleSync(600); }
      } catch (err) {
        this.syncing = false;
        this.syncState = 'error';
        this.syncMsg = '⚠️ 同步失败：' + err.message;
        if (this.tip.indexOf('正在同步') > -1) this.tip = '已保存到本机，云端同步失败，联网后会自动重试';
        if (this.pendingAgain) { this.pendingAgain = false; this.scheduleSync(3000); }
      }
    },
    scheduleSync(delay) {
      if (!this.syncReady) { this.syncState = 'off'; return; }
      this.syncState = 'pending';
      if (this.syncing) { this.pendingAgain = true; return; }
      if (this.syncTimer) clearTimeout(this.syncTimer);
      const self = this;
      this.syncTimer = setTimeout(function () { self.syncNow(); }, delay === undefined ? 700 : delay);
    },
    maybeAutoSync(minGap) {
      if (!this.isLoggedIn || !this.syncReady || this.syncing) return;
      const gap = minGap === undefined ? 15000 : minGap;
      if (this.lastSyncTs && Date.now() - this.lastSyncTs < gap) return;
      this.syncNow();
    },
    async enableSync() {
      this.normalizeForm2();
      if (!this.form2.token) { this.syncMsg = '⚠️ 访问令牌是空的，请先把 github_pat_... 那串粘贴进来再保存'; return; }
      if (!this.tokenLooksValid(this.form2.token)) {
        this.syncMsg = '⚠️ 这串不像 GitHub 令牌（应以 github_pat_ 或 ghp_ 开头，当前长度 ' + this.form2.token.length + ' 个字符），请确认复制的是令牌本身，不是令牌名字';
        return;
      }
      const previous = Object.assign({}, this.sync);
      this.sync = Object.assign({}, this.form2);
      this.syncMsg = '正在连接…';
      try {
        await this.gh('/repos/' + this.sync.owner + '/' + this.sync.repo);
      } catch (err) {
        this.sync = previous;
        this.syncMsg = '⚠️ 连接失败：' + err.message;
        return;
      }
      localStorage.setItem(SYNC_KEY, JSON.stringify(this.sync));
      this.showSync = false;
      await this.syncNow();
    },
    disableSync() {
      this.sync = { owner: '2329118415-lang', repo: 'micky-diary-data', file: 'diary.json', token: '' };
      this.form2 = Object.assign({}, this.sync);
      localStorage.removeItem(SYNC_KEY);
      this.remoteSha = null;
      this.syncMsg = '已断开同步，日记仍保存在本机';
    },
    save() {
      if (!this.form.date) { this.tip = '请先选择这篇日记的日期'; return; }
      if (!this.form.title) { this.tip = '请填写日记标题'; return; }
      this.list.unshift({
        id: Date.now(),
        date: this.form.date,
        title: this.form.title,
        content: this.form.content,
        mood: this.form.mood,
        weather: this.form.weather,
        photo: this.form.photo,
        updatedAt: Date.now()
      });
      this.sortEntries();
      this.persistLocal();
      this.form = { date: this.today(), title: '', content: '', mood: '开心', weather: '晴', photo: '' };
      if (this.syncReady) {
        this.tip = '已保存，正在同步到云端…';
        this.scheduleSync(400);
      } else {
        this.tip = '已保存到本机（还没开启同步，换设备看不到）';
      }
    },
    remove(id) {
      this.list = this.list.filter((item) => item.id !== id);
      if (this.deletedIds.indexOf(id) === -1) this.deletedIds.push(id);
      this.persistLocal();
      this.tip = this.syncReady ? '已删除，正在同步到云端…' : '已删除（本机）';
      this.scheduleSync(400);
    },
    compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 1280;
            let w = img.width;
            let h = img.height;
            if (w > max || h > max) {
              const r = Math.min(max / w, max / h);
              w = Math.round(w * r);
              h = Math.round(h * r);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { resolve(canvas.toDataURL('image/jpeg', 0.82)); }
            catch (err) { resolve(reader.result); }
          };
          img.onerror = () => resolve(reader.result);
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    },
    async pickPhoto(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      this.compressing = true;
      this.form.photo = await this.compressImage(file);
      this.compressing = false;
    }
  },
  unmounted() {
    if (this.autoTimer) clearInterval(this.autoTimer);
    if (this.syncTimer) clearTimeout(this.syncTimer);
  },
  created() {
    this.form.date = this.today();
  }
}).mount('#app');
</script>
</body>
</html>
